<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blog — YUNA</title>
<meta name="description" content="News, guides and updates from YUNA — your local AI companion with a living face.">
<link rel="canonical" href="https://yunaai.online/blog/">
<link rel="icon" type="image/x-icon" href="../favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="../preview/favicon-32.png">
<meta name="theme-color" content="#04040c">
<meta property="og:title" content="Blog — YUNA">
<meta property="og:description" content="News, guides and updates from the YUNA team.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://yunaai.online/blog/">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github-dark.min.css">

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#04040c;--bg2:#07071a;
  --card:#0d0d1f;--card2:#121230;
  --border:rgba(110,150,255,.10);--border2:rgba(110,150,255,.25);
  --accent:#64b5f6;--accent2:#a78bfa;--accent3:#7dd3fc;
  --grad-main:linear-gradient(135deg,#64b5f6,#a78bfa);
  --text:#eef1ff;--text2:#9aa3cc;--text3:#5a6390;
}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;line-height:1.7;overflow-x:hidden;-webkit-font-smoothing:antialiased}

::-webkit-scrollbar{width:10px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:linear-gradient(180deg,var(--accent),var(--accent2));border-radius:8px;border:2px solid var(--bg)}

/* ── NAV ── */
.blog-nav{position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:.9rem 2rem;background:rgba(4,4,12,.85);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border-bottom:1px solid var(--border)}
.logo{font-family:'Space Grotesk',sans-serif;font-size:1.4rem;font-weight:700;background:var(--grad-main);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:5px;text-decoration:none}
.nav-actions{display:flex;gap:1rem;align-items:center}
.nav-back{color:var(--text2);text-decoration:none;font-size:.88rem;font-weight:500;transition:color .2s}
.nav-back:hover{color:var(--accent3)}
.nav-cta{background:var(--grad-main);color:#04040c;padding:.5rem 1.2rem;border-radius:9px;font-weight:700;font-size:.82rem;text-decoration:none;transition:transform .2s,box-shadow .2s;box-shadow:0 4px 16px rgba(100,181,246,.25)}
.nav-cta:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(100,181,246,.4)}

/* ── LAYOUT ── */
.wrap{max-width:1000px;margin:0 auto;padding:0 1.5rem}

/* ── BLOG HEADER ── */
.blog-header{text-align:center;padding:4rem 0 3rem}
.tag{display:inline-block;background:rgba(167,139,250,.1);border:1px solid rgba(167,139,250,.25);color:var(--accent2);font-size:.73rem;font-weight:700;padding:.28rem .85rem;border-radius:100px;margin-bottom:1rem;letter-spacing:1.5px;text-transform:uppercase}
.blog-header h1{font-size:clamp(2rem,5vw,3.2rem);font-weight:900;letter-spacing:-.03em;line-height:1.1;background:linear-gradient(90deg,var(--text),var(--accent3),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:1rem}
.blog-header p{color:var(--text2);font-size:1.05rem;max-width:560px;margin:0 auto;line-height:1.7}

/* ── POSTS GRID ── */
.posts-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:1.4rem;padding-bottom:4rem}
.post-card{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:1.6rem;text-decoration:none;color:inherit;transition:all .3s cubic-bezier(.4,0,.2,1);position:relative;overflow:hidden;min-height:190px}
.post-card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:var(--grad-main);opacity:0;transition:opacity .3s}
.post-card:hover{border-color:var(--border2);transform:translateY(-4px);box-shadow:0 20px 50px rgba(0,0,0,.5),0 0 40px rgba(100,181,246,.08)}
.post-card:hover::before{opacity:1}
.pc-tags{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:.8rem}
.pc-tag{font-size:.68rem;background:rgba(100,181,246,.1);border:1px solid rgba(100,181,246,.2);color:var(--accent3);padding:.15rem .6rem;border-radius:100px;font-weight:600;text-transform:uppercase;letter-spacing:.3px}
.pc-title{font-size:1.2rem;font-weight:700;color:var(--text);line-height:1.35;margin-bottom:.6rem;letter-spacing:-.01em}
.pc-excerpt{font-size:.88rem;color:var(--text2);line-height:1.6;margin-bottom:1rem;flex:1}
.pc-meta{display:flex;gap:.5rem;color:var(--text3);font-size:.78rem;align-items:center}
.pc-meta .dot{opacity:.4}

/* ── SKELETON ── */
.post-card.skeleton{pointer-events:none;opacity:.6}
.sk-line{height:12px;background:linear-gradient(90deg,rgba(100,181,246,.06) 25%,rgba(100,181,246,.14) 50%,rgba(100,181,246,.06) 75%);background-size:200% 100%;border-radius:6px;margin-bottom:.7rem;animation:shimmer 1.4s infinite}
.sk-tag{width:60px;height:18px}
.sk-title{width:80%;height:20px}
.sk-ex{width:100%}
.sk-ex.short{width:70%;margin-bottom:0}
@keyframes shimmer{to{background-position:-200% 0}}

/* ── POST VIEW ── */
.back-link{display:inline-flex;align-items:center;gap:.4rem;color:var(--text2);text-decoration:none;font-size:.9rem;font-weight:600;margin-bottom:1.5rem;padding:.4rem .8rem;border-radius:9px;border:1px solid var(--border);background:var(--card);transition:all .2s}
.back-link:hover{color:var(--accent3);border-color:var(--border2);transform:translateX(-3px)}
.post-header{margin-bottom:2rem;padding-top:2.5rem}
.post-tags{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1rem}
.post-tag{font-size:.72rem;background:rgba(100,181,246,.1);border:1px solid rgba(100,181,246,.25);color:var(--accent3);padding:.2rem .7rem;border-radius:100px;font-weight:600;letter-spacing:.3px;text-transform:uppercase}
#post-title{font-size:clamp(1.8rem,4vw,2.8rem);font-weight:800;letter-spacing:-.03em;line-height:1.15;color:var(--text);margin-bottom:1rem}
.post-meta{display:flex;gap:.6rem;color:var(--text3);font-size:.85rem;flex-wrap:wrap;align-items:center}
.post-meta .dot{opacity:.4}
.post-footer{margin-top:3rem;padding-top:2rem;border-top:1px solid var(--border)}

/* ── MARKDOWN ── */
.md{font-size:1.02rem;line-height:1.8;color:var(--text2)}
.md > *:first-child{margin-top:0}
.md > *:last-child{margin-bottom:0}
.md h1,.md h2,.md h3,.md h4,.md h5,.md h6{color:var(--text);font-weight:800;line-height:1.3;margin:2rem 0 1rem;letter-spacing:-.02em;scroll-margin-top:90px}
.md h1{font-size:2.2rem;letter-spacing:-.03em}
.md h2{font-size:1.6rem;padding-bottom:.4rem;border-bottom:1px solid var(--border)}
.md h3{font-size:1.3rem;color:var(--accent3)}
.md h4{font-size:1.1rem;color:var(--accent)}
.md h5,.md h6{font-size:1rem;color:var(--accent2);text-transform:uppercase;letter-spacing:.08em}
.md p{margin:1rem 0}
.md a{color:var(--accent);text-decoration:none;border-bottom:1px solid rgba(100,181,246,.35);transition:all .2s}
.md a:hover{color:var(--accent3);border-bottom-color:var(--accent3)}
.md strong{color:var(--text);font-weight:700}
.md em{color:var(--accent2)}
.md ul,.md ol{padding-left:1.6rem;margin:1rem 0}
.md li{margin:.35rem 0}
.md li::marker{color:var(--accent2)}
.md blockquote{margin:1.5rem 0;padding:.8rem 1.2rem;border-left:3px solid var(--accent2);background:linear-gradient(90deg,rgba(167,139,250,.08),transparent);border-radius:0 10px 10px 0;color:var(--text2);font-style:italic}
.md blockquote > *:first-child{margin-top:0}
.md blockquote > *:last-child{margin-bottom:0}
.md code{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:.88em;background:rgba(100,181,246,.1);color:var(--accent3);padding:.15em .4em;border-radius:5px;border:1px solid rgba(100,181,246,.15)}
.md pre{margin:1.2rem 0;padding:1rem 1.2rem;background:#07071a;border:1px solid var(--border);border-radius:12px;overflow-x:auto;font-size:.88rem;line-height:1.6}
.md pre code{background:none;border:none;color:inherit;padding:0;font-size:inherit}
.md img{max-width:100%;border-radius:12px;border:1px solid var(--border);margin:1.2rem 0;display:block}
.md table{width:100%;border-collapse:collapse;margin:1.2rem 0;font-size:.92rem;border:1px solid var(--border);border-radius:10px;overflow:hidden}
.md th,.md td{padding:.6rem 1rem;border-bottom:1px solid var(--border);text-align:left}
.md th{background:rgba(100,181,246,.06);color:var(--text);font-weight:700}
.md tr:last-child td{border-bottom:none}
.md hr{border:none;height:1px;background:linear-gradient(90deg,transparent,var(--border2),transparent);margin:2rem 0}
.md input[type="checkbox"]{accent-color:var(--accent);margin-right:.4rem}
.md del{color:var(--text3)}

/* ── STATES ── */
.empty{padding:3rem 1rem;text-align:center;color:var(--text2);background:var(--card);border:1px dashed var(--border2);border-radius:14px}
.error-box{padding:1.5rem;text-align:center;background:rgba(248,113,113,.06);border:1px solid rgba(248,113,113,.25);border-radius:14px;color:var(--text2)}
.error-box strong{color:#ff9090}
.err-msg{font-size:.85rem;margin:.5rem 0;color:#ff9090}
.err-hint{font-size:.8rem;color:var(--text3)}
.err-hint code{color:var(--accent3);background:rgba(100,181,246,.1);padding:.1em .4em;border-radius:4px}
.loading-box{padding:3rem 1rem;text-align:center;color:var(--text3)}
.spinner{width:36px;height:36px;margin:0 auto 1rem;border-radius:50%;border:3px solid rgba(100,181,246,.15);border-top-color:var(--accent2);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── FOOTER ── */
.blog-footer{text-align:center;padding:3rem 1.5rem;border-top:1px solid var(--border);background:var(--bg2);color:var(--text3);font-size:.85rem}
.blog-footer a{color:var(--text2);text-decoration:none;transition:color .2s}
.blog-footer a:hover{color:var(--accent3)}

/* ── RESPONSIVE ── */
@media(max-width:820px){
  .blog-nav{padding:.8rem 1.2rem}
  .blog-header{padding:3rem 0 2rem}
  .posts-grid{grid-template-columns:1fr;gap:1rem}
  .md h1{font-size:1.7rem}
  .md h2{font-size:1.35rem}
  .md h3{font-size:1.15rem}
}
@media(max-width:520px){
  .nav-back{display:none}
  .md table{font-size:.82rem}
  .md th,.md td{padding:.45rem .6rem}
}
</style>
</head>
<body>

<nav class="blog-nav">
  <a href="../" class="logo">YUNA</a>
  <div class="nav-actions">
    <a href="../" class="nav-back">← Back to site</a>
    <a href="../#pricing" class="nav-cta">⬇ Download</a>
  </div>
</nav>

<main class="wrap">
  <!-- LIST VIEW -->
  <section id="list-view">
    <header class="blog-header">
      <div class="tag">Blog</div>
      <h1>News, guides &amp; updates</h1>
      <p>Everything about your local AI companion — release notes, tutorials, and behind-the-scenes.</p>
    </header>
    <div id="posts-grid" class="posts-grid"></div>
  </section>

  <!-- POST VIEW -->
  <section id="post-view" hidden>
    <a href="./" class="back-link" data-home>← All posts</a>
    <article>
      <header class="post-header">
        <div id="post-tags" class="post-tags"></div>
        <h1 id="post-title">Loading…</h1>
        <div id="post-meta" class="post-meta"></div>
      </header>
      <div id="post-content" class="md"></div>
    </article>
    <footer class="post-footer">
      <a href="./" class="back-link" data-home>← All posts</a>
    </footer>
  </section>
</main>

<footer class="blog-footer">
  <p>© 2026 YUNA · <a href="../">Home</a> · <a href="https://discord.gg/ARg6yujhdc" target="_blank" rel="noopener noreferrer">Discord</a> · <a href="https://ko-fi.com/code7" target="_blank" rel="noopener noreferrer">Support</a></p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.11/dist/purify.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>

<script>
(function(){
  'use strict';

  const MANIFEST_URL = '../blogs/index.json';
  const POST_URL = slug => `../blogs/${encodeURIComponent(slug)}.md`;

  const el = {
    list: document.getElementById('list-view'),
    post: document.getElementById('post-view'),
    grid: document.getElementById('posts-grid'),
    postTags: document.getElementById('post-tags'),
    postTitle: document.getElementById('post-title'),
    postMeta: document.getElementById('post-meta'),
    postContent: document.getElementById('post-content'),
  };
  const state = { posts: null };

  /* ── Utils ── */
  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }
  function formatDate(iso){
    if (!iso) return '';
    try {
      const d = new Date(iso.length === 10 ? iso + 'T00:00:00Z' : iso);
      return d.toLocaleDateString('en-US', { year:'numeric', month:'short', day:'numeric' });
    } catch { return iso; }
  }
  function readingTime(text){
    const words = (text || '').trim().split(/\s+/).filter(Boolean).length;
    return Math.max(1, Math.round(words / 200));
  }
  function slugify(str){
    return String(str || '').toLowerCase().trim()
      .replace(/[^\w\u0600-\u06ff-]+/g, '-')
      .replace(/^-+|-+$/g, '');
  }

  /* ── Data ── */
  async function loadManifest(){
    if (state.posts) return state.posts;
    const res = await fetch(MANIFEST_URL, { cache: 'no-store' });
    if (!res.ok) throw new Error('Failed to load posts manifest (' + res.status + ')');
    const data = await res.json();
    const posts = Array.isArray(data) ? data : (data.posts || []);
    posts.sort((a, b) => new Date(b.date || 0) - new Date(a.date || 0));
    state.posts = posts;
    return posts;
  }

  async function loadMarkdown(slug){
    const res = await fetch(POST_URL(slug), { cache: 'no-store' });
    if (!res.ok) throw new Error('Post not found (' + res.status + ')');
    return await res.text();
  }

  /* ── Render ── */
  function renderList(posts){
    if (!posts.length) {
      el.grid.innerHTML = '<div class="empty">No posts yet — check back soon.</div>';
      return;
    }
    el.grid.innerHTML = posts.map(p => {
      const tags = (p.tags || []).map(t => `<span class="pc-tag">${esc(t)}</span>`).join('');
      return `
        <a href="?p=${encodeURIComponent(p.slug)}" class="post-card" data-post="${esc(p.slug)}">
          ${tags ? `<div class="pc-tags">${tags}</div>` : ''}
          <h2 class="pc-title">${esc(p.title || 'Untitled')}</h2>
          ${p.excerpt ? `<p class="pc-excerpt">${esc(p.excerpt)}</p>` : ''}
          <div class="pc-meta">
            <span>${formatDate(p.date)}</span>
            ${p.author ? `<span class="dot">·</span><span>${esc(p.author)}</span>` : ''}
          </div>
        </a>`;
    }).join('');
  }

  function renderSkeletons(){
    el.grid.innerHTML = Array.from({length:3}).map(() => `
      <div class="post-card skeleton">
        <div class="sk-line sk-tag"></div>
        <div class="sk-line sk-title"></div>
        <div class="sk-line sk-ex"></div>
        <div class="sk-line sk-ex short"></div>
      </div>`).join('');
  }

  function processMarkdownHTML(html){
    const tmp = document.createElement('div');
    tmp.innerHTML = html;
    tmp.querySelectorAll('h1,h2,h3,h4,h5,h6').forEach(h => {
      if (!h.id) h.id = slugify(h.textContent);
    });
    tmp.querySelectorAll('a[href^="http"]').forEach(a => {
      a.setAttribute('target', '_blank');
      a.setAttribute('rel', 'noopener noreferrer');
    });
    return tmp.innerHTML;
  }

  function renderMarkdown(md){
    const raw = marked.parse(md || '', { gfm: true, breaks: false });
    const clean = window.DOMPurify
      ? DOMPurify.sanitize(raw, { ADD_ATTR: ['target', 'rel'] })
      : raw;
    return processMarkdownHTML(clean);
  }

  function highlight(){
    if (!window.hljs) return;
    el.postContent.querySelectorAll('pre code').forEach(block => {
      try { hljs.highlightElement(block); } catch(_) {}
    });
  }

  function renderPost(meta, md){
    const title = (meta && meta.title) || 'Untitled';
    el.postTitle.textContent = title;
    document.title = title + ' — YUNA Blog';

    const tags = ((meta && meta.tags) || []).map(t => `<span class="post-tag">${esc(t)}</span>`).join('');
    el.postTags.innerHTML = tags;

    const bits = [];
    if (meta && meta.date) bits.push(`<span>${formatDate(meta.date)}</span>`);
    if (meta && meta.author) bits.push(`<span>${esc(meta.author)}</span>`);
    bits.push(`<span>${readingTime(md)} min read</span>`);
    el.postMeta.innerHTML = bits.join('<span class="dot">·</span>');

    el.postContent.innerHTML = renderMarkdown(md);
    highlight();
  }

  /* ── Views ── */
  async function showList(){
    el.list.hidden = false;
    el.post.hidden = true;
    document.title = 'Blog — YUNA';
    if (state.posts) { renderList(state.posts); return; }
    renderSkeletons();
    try {
      const posts = await loadManifest();
      renderList(posts);
    } catch (e) {
      el.grid.innerHTML = `<div class="error-box">
        <p><strong>Could not load posts.</strong></p>
        <p class="err-msg">${esc(e.message)}</p>
        <p class="err-hint">Make sure <code>blogs/index.json</code> exists and is reachable.</p>
      </div>`;
    }
  }

  async function showPost(slug){
    el.list.hidden = true;
    el.post.hidden = false;
    el.postTitle.textContent = 'Loading…';
    el.postMeta.innerHTML = '';
    el.postTags.innerHTML = '';
    el.postContent.innerHTML = '<div class="loading-box"><div class="spinner"></div><p>Loading post…</p></div>';

    try {
      const [posts, md] = await Promise.all([loadManifest(), loadMarkdown(slug)]);
      const meta = posts.find(p => p.slug === slug) || { slug, title: slug };
      renderPost(meta, md);
    } catch (e) {
      el.postTitle.textContent = 'Post not found';
      document.title = 'Post not found — YUNA Blog';
      el.postContent.innerHTML = `<div class="error-box">
        <p><strong>Could not load this post.</strong></p>
        <p class="err-msg">${esc(e.message)}</p>
        <p class="err-hint">The post <code>${esc(slug)}</code> may have been moved or deleted.</p>
      </div>`;
    }
  }

  /* ── Routing ── */
  function getSlug(){
    return new URLSearchParams(location.search).get('p');
  }
  function route(){
    const slug = getSlug();
    if (slug) showPost(slug); else showList();
  }

  /* ── SPA Navigation ── */
  document.addEventListener('click', (e) => {
    const home = e.target.closest('a[data-home]');
    if (home) {
      e.preventDefault();
      history.pushState({}, '', './');
      showList();
      window.scrollTo(0, 0);
      return;
    }
    const post = e.target.closest('a[data-post]');
    if (post) {
      e.preventDefault();
      const slug = post.getAttribute('data-post');
      history.pushState({ slug }, '', `?p=${encodeURIComponent(slug)}`);
      showPost(slug);
      window.scrollTo(0, 0);
    }
  });
  window.addEventListener('popstate', route);

  route();
})();
</script>
</body>
</html>
